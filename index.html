<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2236">
<title>Licorería Vitys Clark</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitys Clark">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ============ PANTALLA DE CARGA ============ -->
<div id="splash" class="splash">
  <img src="./icon-192.png" alt="logo" class="splash-logo">
  <div class="splash-txt">Cargando...</div>
</div>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-wrap" style="display:none">
  <div class="login-card">
    <div class="login-logo" id="loginLogo"><img src="./icon-192.png" alt="logo" class="brand-logo-lg"></div>
    <h1 id="loginTitle">Licorería Vitys Clark</h1>
    <p class="login-sub">Inicia sesión para continuar</p>
    <label class="lbl" for="logUser">Usuario o ID</label>
    <input id="logUser" class="inp" type="text" placeholder="Ej: Pedro" autocomplete="username">
    <label class="lbl" for="logPin">PIN</label>
    <input id="logPin" class="inp" type="password" placeholder="••••" autocomplete="current-password" inputmode="numeric">
    <label class="check2"><input type="checkbox" id="logRecordar" checked> Mantener sesión abierta</label>
    <div id="loginMsg" class="msg"></div>
    <button class="btn btn-block" id="btnLogin">Entrar</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" style="display:none">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand" id="brand"></div>
      <button class="burger" id="burger" aria-label="Menú">&#9776;</button>
    </div>
    <div class="nav-wrap" id="navWrap">
      <nav class="menu" id="menu">
        <button class="nav-btn active" data-view="dashboard"><span class="ni">&#128202;</span><span>Dashboard</span></button>
        <button class="nav-btn" data-view="ventas"><span class="ni">&#128722;</span><span>Ventas</span></button>
        <button class="nav-btn" data-view="inventario"><span class="ni">&#128230;</span><span>Inventario</span></button>
        <button class="nav-btn" data-view="compras"><span class="ni">&#128666;</span><span>Compras</span></button>
        <button class="nav-btn" data-view="clientes"><span class="ni">&#128101;</span><span>Clientes</span></button>
        <button class="nav-btn" data-view="admin"><span class="ni">&#9881;</span><span>Admin</span></button>
      </nav>
      <div class="user-box">
        <span id="userLabel"></span>
        <button class="btn-salir" id="btnSalir">Salir</button>
      </div>
    </div>
  </header>
  <main id="content"></main>
</div>

<!-- Librería de respaldo para leer códigos si el navegador no trae lector nativo -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
